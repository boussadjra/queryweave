name: Release

on:
  push:
    branches:
      - main

# The default token is read-only. Each job asks for exactly what it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  verify:
    name: Verify
    # Never from a fork, and never from a pull request.
    if: ${{ github.repository == 'queryweave/queryweave' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The complete gate, plus the consumer fixtures. Publishing may not skip either.
      - name: Run the release gate
        run: pnpm check:release

  release:
    name: Version or publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      # Open and update the release pull request.
      contents: write
      pull-requests: write
      # npm trusted publishing. Requested only by this job, and only for OIDC.
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # npm's own CLI performs the OIDC exchange, so it must be recent enough to support it.
      - name: Use an npm release that supports trusted publishing
        run: npm install --global npm@latest

      - name: Build packages
        run: pnpm build --filter=!@queryweave/docs

      - name: Validate packages and archives
        run: pnpm package:check && pnpm artifacts:check

      # With no changesets pending this opens or updates the release pull request and publishes
      # nothing. With a version commit on main it publishes through `pnpm release`.
      - name: Create a release pull request or publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run version
          publish: pnpm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NODE_AUTH_TOKEN and no NPM_TOKEN: authentication is the OIDC exchange above.
          # Trusted publishing must be configured for every @queryweave package on npm.
          NPM_CONFIG_PROVENANCE: "true"
