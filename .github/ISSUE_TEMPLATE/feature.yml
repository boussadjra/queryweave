name: Feature proposal
description: Propose a capability that fits QueryWeave's model-first architecture.
title: "[Proposal]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What cross-runtime URL-state problem should QueryWeave solve?
    validations:
      required: true
  - type: textarea
    id: model
    attributes:
      label: Model-first shape
      description: Explain which domain concept and runtime boundary own the proposal.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
