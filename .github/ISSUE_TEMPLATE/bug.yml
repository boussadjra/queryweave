name: Bug report
description: Report reproducible behavior that does not match QueryWeave's documented contract.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve QueryWeave.
  - type: input
    id: package
    attributes:
      label: Package
      description: Which QueryWeave package is affected?
      placeholder: "@queryweave/core"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide a minimal reproduction and the commands required to run it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: QueryWeave, Node.js, package manager, runtime, and framework versions.
    validations:
      required: true
